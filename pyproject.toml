[project]
name = "strobes-agents-mcp"
version = "1.1.0"
description = "MCP server for Strobes AI agents: spin up & stop agent tasks, follow their work, read findings/files, run workflows. Browser sign-in shared with the Strobes CLI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Strobes", email = "support@strobes.co" }]
license = { text = "GPL-3.0-or-later" }
keywords = ["mcp", "model-context-protocol", "strobes", "ai-agents", "pentest", "security", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://strobes.co"
Repository = "https://github.com/strobes-co/strobes-agents-mcp"

[project.scripts]
strobes-agents-mcp = "strobes_agents_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strobes_agents_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
