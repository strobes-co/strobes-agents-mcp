[project]
name = "strobes-agents-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Strobes AI workspaces & agents — spin up / stop agent tasks, chat with agents, manage workspaces, from Claude Code."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Strobes" }]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "mcp>=1.2,<2",
    "requests>=2.31",
    "sgqlc>=16.3",
    "strobes-graphql-client",
]

[project.scripts]
strobes-agents-mcp = "strobes_agents_mcp.server:main"

[tool.uv.sources]
strobes-graphql-client = { git = "https://github.com/strobes-co/strobes-gql-client.git", branch = "feat/agent-workspace-mcp-ops" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strobes_agents_mcp"]
